<title>AI Audio Digest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a broadcast rundown sheet. One column: the newest brief with its player on top, then the transcript as numbered segments, then past briefs as a log. */
:root {
  --bg: #f3f5f4;
  --surface: #ffffff;
  --ink: #16201d;
  --muted: #5a6864;
  --line: #d6ddda;
  --accent: #0e6b62;
  --accent-soft: #dcefeb;
  --wild: #8a4b0f;
  --wild-soft: #f6e9da;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Literata", Georgia, "Times New Roman", serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1514; --surface: #161e1c; --ink: #e2e9e6; --muted: #92a19c; --line: #26312e;
    --accent: #5cc6b8; --accent-soft: #173330; --wild: #e0a569; --wild-soft: #33261a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1514; --surface: #161e1c; --ink: #e2e9e6; --muted: #92a19c; --line: #26312e;
  --accent: #5cc6b8; --accent-soft: #173330; --wild: #e0a569; --wild-soft: #33261a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.6;
  padding-inline: 16px; padding-block: 28px 64px;
}
.wrap { max-width: 44rem; margin: 0 auto; display: flex; flex-direction: column; gap: 32px; }
a { color: var(--accent); }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

.masthead { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; border-bottom: 2px solid var(--ink); padding-bottom: 10px; }
.masthead h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; letter-spacing: 0.02em; margin: 0; }
.masthead .sched { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }

.brief-head { display: flex; flex-direction: column; gap: 6px; }
.eyebrow { font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
.brief-head h2 { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.9rem, 6vw, 2.6rem); line-height: 1.08; margin: 0; text-wrap: balance; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 18px; font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }

.player { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.player-row { display: flex; align-items: center; gap: 14px; }
.play { flex: none; width: 52px; height: 52px; border-radius: 50%; border: 0; background: var(--accent); color: var(--surface); cursor: pointer; display: grid; place-items: center; }
.play svg { width: 20px; height: 20px; fill: currentColor; }
.track { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.bar { position: relative; height: 8px; border-radius: 4px; background: var(--accent-soft); cursor: pointer; }
.bar span { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 4px; background: var(--accent); }
.times { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.player-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
.speeds { display: flex; gap: 6px; }
.speeds button { font-family: var(--font-mono); font-size: 0.75rem; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; font-variant-numeric: tabular-nums; }
.speeds button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.dropbox { font-family: var(--font-mono); font-size: 0.75rem; }
.audio-missing { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); }

.transcript { display: flex; flex-direction: column; gap: 0; }
.transcript h3 { font-family: var(--font-mono); font-weight: 500; font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.say { margin: 0; padding-block: 10px; max-width: 65ch; }
.seg { display: grid; grid-template-columns: 2.2rem 1fr; gap: 0 10px; padding-block: 16px; border-top: 1px solid var(--line); }
.seg-no { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); padding-top: 4px; font-variant-numeric: tabular-nums; }
.seg-body { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.seg-body p { margin: 0; max-width: 65ch; }
.seg.wild .seg-no { color: var(--wild); }
.tag { align-self: flex-start; font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--wild); background: var(--wild-soft); padding: 2px 8px; border-radius: 4px; }
.links { display: flex; flex-direction: column; gap: 4px; }
.links a { font-family: var(--font-mono); font-size: 0.8rem; line-height: 1.45; overflow-wrap: anywhere; text-decoration-thickness: 1px; text-underline-offset: 3px; }
.src { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); }
.footer-note { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; margin: 0; }

.log h3 { font-family: var(--font-display); font-size: 1.1rem; margin: 0 0 8px; }
.log ol { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.log li a { display: grid; grid-template-columns: 7.5rem 1fr auto; gap: 12px; align-items: baseline; padding: 12px 4px; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink); }
.log li a:hover .log-sum { color: var(--accent); }
.log li a[aria-current="true"] { background: var(--accent-soft); }
.log-date { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.log-sum { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.95rem; }
.log-n { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); }
@media (max-width: 520px) {
  .log li a { grid-template-columns: 1fr auto; }
  .log-sum { grid-column: 1 / -1; white-space: normal; }
}
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 24px; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .bar span { transition: width 0.2s linear; } }
</style>

<div class="wrap">
  <header class="masthead">
    <h1>AI Audio Digest</h1>
    <span class="sched">New brief every 3 days</span>
  </header>

  <main id="brief" aria-live="polite">
    <div class="empty" id="loading">Loading the latest brief. Each run adds a new one here with its audio, the full transcript and the direct links.</div>
  </main>

  <section class="log" id="log" hidden>
    <h3>All briefs</h3>
    <ol id="log-list"></ol>
  </section>
</div>

<script>
(function () {
  const $ = (sel, el = document) => el.querySelector(sel);
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const fmtDate = (iso) => {
    const d = new Date(iso + "T12:00:00Z");
    return d.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });
  };
  const fmtTime = (s) => { if (!isFinite(s)) return "0:00"; s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
  const isWild = (t) => /^\s*(here'?s a wildcard|another wildcard|and a last wildcard|a last wildcard|wildcard)/i.test(t);
  const words = (b) => [b.intro, ...b.items.map(i => i.text), b.outro].join(" ").split(/\s+/).filter(Boolean).length;
  const summary = (b) => (b.headline || (b.items[0] && b.items[0].text) || "").replace(/\s+/g, " ");

  let index = [];

  async function getJSON(path) {
    const r = await fetch(path, { cache: "no-store" });
    if (!r.ok) throw new Error(path + " " + r.status);
    return r.json();
  }

  function renderPlayer(b) {
    const box = el("section", "player");
    box.setAttribute("aria-label", "Audio");
    const src = b.audio && b.audio.src;
    if (!src) {
      box.append(el("p", "audio-missing", b.audio && b.audio.note ? b.audio.note : "No audio for this brief."));
    } else {
      const audio = new Audio();
      audio.preload = "metadata";
      audio.src = src;
      const row = el("div", "player-row");
      const btn = el("button", "play");
      btn.id = "play";
      btn.type = "button";
      btn.setAttribute("aria-label", "Play");
      const PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>';
      const PAUSE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/></svg>';
      btn.innerHTML = PLAY;
      const track = el("div", "track");
      const bar = el("div", "bar"); const fill = el("span"); bar.append(fill);
      bar.setAttribute("role", "slider"); bar.setAttribute("aria-label", "Seek"); bar.tabIndex = 0;
      const times = el("div", "times"); const cur = el("span", null, "0:00"); const dur = el("span", null, "--:--"); times.append(cur, dur);
      track.append(bar, times);
      row.append(btn, track);
      btn.addEventListener("click", () => { audio.paused ? audio.play().catch(() => {}) : audio.pause(); });
      audio.addEventListener("play", () => { btn.innerHTML = PAUSE; btn.setAttribute("aria-label", "Pause"); });
      audio.addEventListener("pause", () => { btn.innerHTML = PLAY; btn.setAttribute("aria-label", "Play"); });
      audio.addEventListener("loadedmetadata", () => { dur.textContent = fmtTime(audio.duration); const rt = $("#runtime"); if (rt) rt.textContent = fmtTime(audio.duration) + " runtime"; });
      audio.addEventListener("timeupdate", () => { cur.textContent = fmtTime(audio.currentTime); if (audio.duration) fill.style.width = (audio.currentTime / audio.duration * 100) + "%"; });
      audio.addEventListener("error", () => { dur.textContent = "unavailable"; });
      const seek = (x) => { const r = bar.getBoundingClientRect(); if (audio.duration) audio.currentTime = Math.min(1, Math.max(0, (x - r.left) / r.width)) * audio.duration; };
      bar.addEventListener("click", (e) => seek(e.clientX));
      bar.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight") { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 10); e.preventDefault(); }
        if (e.key === "ArrowLeft") { audio.currentTime = Math.max(0, audio.currentTime - 10); e.preventDefault(); }
      });
      const foot = el("div", "player-foot");
      const speeds = el("div", "speeds");
      [1, 1.25, 1.5].forEach((s) => {
        const sb = el("button", null, s + "x"); sb.type = "button"; sb.id = "speed-" + String(s).replace(".", "-");
        sb.setAttribute("aria-pressed", s === 1 ? "true" : "false");
        sb.addEventListener("click", () => { audio.playbackRate = s; speeds.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === sb ? "true" : "false")); });
        speeds.append(sb);
      });
      foot.append(speeds);
      if (b.audio.dropbox) {
        const dl = el("a", "dropbox", "Open MP3 in Dropbox");
        dl.href = b.audio.dropbox; dl.target = "_blank"; dl.rel = "noopener";
        foot.append(dl);
      }
      box.append(row, foot);
    }
    return box;
  }

  function renderBrief(b) {
    const main = $("#brief");
    main.replaceChildren();
    const frag = el("div");
    frag.style.display = "flex"; frag.style.flexDirection = "column"; frag.style.gap = "24px";

    const head = el("div", "brief-head");
    const wildCount = b.items.filter(i => i.wildcard === true || isWild(i.text)).length;
    head.append(el("span", "eyebrow", index[0] && index[0].date === b.date ? "Latest brief" : "Brief"));
    head.append(el("h2", null, fmtDate(b.date)));
    const stats = el("div", "stats");
    stats.append(el("span", null, b.items.length + " items" + (wildCount ? " · " + wildCount + " wildcards" : "")));
    stats.append(el("span", null, words(b) + " words"));
    const rt = el("span", null, "~" + Math.max(1, Math.round(words(b) / 160)) + " min listen"); rt.id = "runtime"; stats.append(rt);
    head.append(stats);

    const tr = el("section", "transcript");
    tr.append(el("h3", null, "Transcript"));
    if (b.intro) tr.append(el("p", "say", b.intro));
    b.items.forEach((item, n) => {
      const wild = item.wildcard === true || isWild(item.text);
      const seg = el("article", "seg" + (wild ? " wild" : ""));
      seg.append(el("span", "seg-no", String(n + 1).padStart(2, "0")));
      const body = el("div", "seg-body");
      if (wild) body.append(el("span", "tag", "Wildcard"));
      body.append(el("p", null, item.text));
      const links = el("div", "links");
      (item.urls || []).forEach((u) => { const a = el("a", null, u); a.href = u; a.target = "_blank"; a.rel = "noopener"; links.append(a); });
      if (links.childElementCount) body.append(links);
      if (item.source) body.append(el("span", "src", item.source));
      seg.append(body);
      tr.append(seg);
    });
    if (b.outro) { const o = el("p", "say", b.outro); o.style.borderTop = "1px solid var(--line)"; tr.append(o); }

    frag.append(head, renderPlayer(b), tr);
    if (b.footer) frag.append(el("p", "footer-note", b.footer));
    main.append(frag);
    document.querySelectorAll("#log-list a").forEach(a => a.setAttribute("aria-current", a.dataset.date === b.date ? "true" : "false"));
  }

  function renderLog() {
    const list = $("#log-list");
    list.replaceChildren();
    index.forEach((e) => {
      const li = el("li");
      const a = el("a");
      a.href = "#d" + e.date; a.dataset.date = e.date;
      a.append(el("span", "log-date", fmtDate(e.date)), el("span", "log-sum", e.summary || ""), el("span", "log-n", (e.items || 0) + " items"));
      a.addEventListener("click", (ev) => { ev.preventDefault(); show(e.date, true); });
      li.append(a); list.append(li);
    });
    $("#log").hidden = index.length === 0;
  }

  async function show(date, scroll) {
    try {
      const b = await getJSON("briefs/" + date + ".json");
      renderBrief(b);
      try { history.replaceState(null, "", "#d" + date); } catch (e) {}
      if (scroll) window.scrollTo({ top: 0, behavior: "smooth" });
    } catch (e) {
      $("#brief").replaceChildren(el("div", "empty", "This brief could not be loaded. Pick another one below."));
    }
  }

  async function start() {
    try {
      index = await getJSON("briefs/index.json");
      index.sort((a, b) => b.date.localeCompare(a.date));
    } catch (e) {
      $("#loading").textContent = "No briefs yet. The next scheduled run will add the first one here, with its audio, the full transcript and the direct links.";
      return;
    }
    renderLog();
    const want = (location.hash || "").replace(/^#d/, "");
    const pick = index.find(e => e.date === want) || index[0];
    if (pick) show(pick.date, false);
  }
  start();
})();
</script>
